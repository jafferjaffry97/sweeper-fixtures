name: Update Fixtures

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes — GitHub throttles to ~5 min minimum
  workflow_dispatch:         # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest fixtures
        run: node scripts/fetch-fixtures.mjs
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}

      - name: Commit and push if fixtures changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures.json
          if git diff --staged --quiet; then
            echo "fixtures.json unchanged — nothing to commit"
          else
            git commit -m "chore: update fixtures $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
