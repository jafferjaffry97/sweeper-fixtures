name: Update Feeds

on:
  schedule:
    # Every 30 minutes. Competitions outside their season window make zero
    # requests and exit immediately, so off-season runs are almost free.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      competition:
        description: 'Single competition id to rebuild (blank = all)'
        required: false
        default: ''
      full:
        description: 'Rebuild the whole season window instead of incrementally'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build feeds
        env:
          ONLY: ${{ github.event.inputs.competition }}
          FULL: ${{ github.event.inputs.full }}
        run: |
          set -euo pipefail
          flag=""
          if [ "${FULL:-false}" = "true" ]; then flag="--full"; fi

          if [ -n "${ONLY:-}" ]; then
            ids="$ONLY"
          else
            ids=$(ls competitions/*.json | xargs -n1 basename | sed 's/\.json$//')
          fi

          for id in $ids; do
            echo "::group::$id"
            # One competition failing (an ESPN outage, a changed slug) must not
            # stop the others from updating.
            node scripts/fetch-competition.mjs "$id" $flag || echo "::warning::$id failed"
            echo "::endgroup::"
          done

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures.json feeds/
          if git diff --staged --quiet; then
            echo "no feed changes — nothing to commit"
          else
            git commit -m "chore: update feeds $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
